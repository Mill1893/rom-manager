name: Sync core

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify generated fixture
        shell: bash
        run: |
          node fixtures/nes/generate.mjs
          git diff --exit-code -- fixtures/nes/tracers.nes fixtures/nes/tracers.sha256
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      # The optional provider feature must hold the same bar, or it rots.
      - run: cargo clippy --all-targets --features provider-http -- -D warnings
      - run: cargo test --all-targets
      - name: Type-check and test the UI
        working-directory: ui
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build

  # Host-behaviour probes: recorded as evidence, never gating. A Windows
  # servicing update that changes reserved-name or case-fold behaviour must not
  # break the build — the product's own rules are asserted by the suite above.
  host-behaviour:
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Probe host path and handle behaviour
        shell: pwsh
        run: |
          $out = "probe-report"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $probes = "docs/research/windows-path-probes"
          if (-not (Test-Path $probes)) {
            "No probes on this branch." | Tee-Object -FilePath "$out/skipped.txt"
            exit 0
          }
          Get-ChildItem "$probes/*.ps1" | ForEach-Object {
            # Probes record what this host does; a probe that errors is itself
            # a result, so its output is captured either way.
            & powershell -NoProfile -ExecutionPolicy Bypass -File $_.FullName *>&1 |
              Tee-Object -FilePath "$out/$($_.BaseName).txt"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-host-behaviour
          path: probe-report

  # The packaged Windows tracer (#35). Unsigned by design: code signing is out
  # of scope for the first release.
  package-windows:
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Type-check and test the UI
        working-directory: ui
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build
      - name: Build the Windows target
        run: cargo build --release --target x86_64-pc-windows-msvc
      # The NSIS side has the same shape as the AppImage side but a much smaller
      # surface: one plugin DLL, which Tauri already pins by version and checks
      # by hash. Caching its tool directory means a restored run does not
      # re-request it — this download has previously returned HTTP 500. A cold
      # run still fetches, and Tauri does that itself, so its retry behaviour is
      # not ours to set. That is the honest limit of this step: it narrows the
      # window rather than closing it, and unlike the Linux job it has not been
      # observed making a build network-free.
      #
      # The key is a proxy, not a precise one. What decides the DLL is the
      # bundler version inside @tauri-apps/cli, so the lock file that pins the
      # CLI is the closest thing available — at the cost of an unrelated
      # frontend bump also evicting it.
      - name: Restore Tauri's NSIS tooling
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\tauri
          key: nsis-tools-${{ runner.os }}-${{ hashFiles('ui/package-lock.json') }}
      # Frontend already built in the UI step; see tauri/README.md.
      # --verbose for the same reason as the AppImage job: without it a bundler
      # failure arrives with no diagnostics attached.
      - name: Bundle the unsigned NSIS installer
        run: npx --prefix ui tauri build --bundles nsis --verbose
      - name: Run the filesystem tracer against a real Windows volume
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\tracer" | Out-Null
          & "target\x86_64-pc-windows-msvc\release\rom-manager-tracer.exe" `
            --target "$env:RUNNER_TEMP\tracer" --json | Tee-Object -FilePath tracer-windows.json
          if ($LASTEXITCODE -ne 0) { throw "the tracer reported a failing scenario" }
      # #35 asks CI to retain installer hashes and exact build identity for the
      # milestone report. That report has carried a hand-pasted SHA-256 against
      # a commit many merges old — a digest transcribed once says nothing about
      # the build anyone is actually holding.
      - name: Record what this job built
        shell: bash
        run: |
          scripts/record-build-identity.sh build-identity-windows.md \
            "$(ls tauri/target/release/bundle/nsis/*.exe | head -1)" \
            target/x86_64-pc-windows-msvc/release/rom-manager-tracer.exe \
            tauri/target/release/rom-manager.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows-unsigned-package
          path: |
            target/x86_64-pc-windows-msvc/release/rom-manager-tracer.exe
            tracer-windows.json
            build-identity-windows.md
            tauri/target/release/bundle/nsis/*.exe
            tauri/target/release/rom-manager.exe
            tauri/tauri.conf.json

  # The Linux AppImage (#76). Unsigned, like the Windows package: signing is
  # out of scope for the first release.
  package-linux:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install Tauri build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
                                  librsvg2-dev patchelf desktop-file-utils
          # FUSE, so the containment check below can mount the finished bundle
          # and see the real thing. Ubuntu 24.04 renamed libfuse2 to
          # libfuse2t64; accept either rather than pin to one runner image.
          sudo apt-get install -y libfuse2t64 || sudo apt-get install -y libfuse2
      - name: Type-check and test the UI
        working-directory: ui
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build
      - name: Build the release binary
        run: cargo build --release
      # Bundling an AppImage pulls six tools from three hosts. Restoring them
      # from cache is what keeps the release path off the network; the fetch
      # below is the fallback, and it retries and verifies. See
      # packaging/bundler-tools.lock.
      - name: Restore the pinned bundler tools
        uses: actions/cache@v4
        with:
          path: ~/.cache/rom-manager-bundler
          key: bundler-tools-${{ runner.os }}-${{ hashFiles('packaging/bundler-tools.lock') }}
      - name: Fetch any bundler tools the cache did not supply
        run: scripts/fetch-bundler-tools.sh
      # The frontend is built in the UI step above rather than by a
      # beforeBuildCommand — see tauri/README.md for why that hook is absent.
      #
      # --verbose is load-bearing. Without it Tauri discards linuxdeploy's
      # output, and a packaging failure reads only `failed to run linuxdeploy`
      # with no indication of which of its six downloads or twenty steps went
      # wrong. That is how this job stayed unexplained through two failures.
      # LDAI_RUNTIME_FILE points the AppImage plugin at the runtime it would
      # otherwise fetch itself. The fetch step exports it through $GITHUB_ENV
      # rather than the path being written out again here, which would be a
      # second copy of a location the script decides — and the wrong one
      # wherever XDG_CACHE_HOME is set.
      - name: Bundle the AppImage
        run: npx --prefix ui tauri build --bundles appimage --verbose
      - name: Record bundled dependency licences
        run: |
          cargo tree --edges normal --prefix none --format '{p} {l}' \
            | sort -u > packaging/linux/resolved-licences.txt
          # The Rust graph above is not what the AppImage ships. This reads the
          # built artefact, which is where the LGPL obligations actually are.
          ./scripts/record-bundled-licences.sh \
            "$(ls tauri/target/release/bundle/appimage/*.AppImage | head -1)" \
            packaging/linux/bundled-licences.md
      - name: Validate the desktop entry
        run: desktop-file-validate packaging/linux/rom-manager.desktop
      # #76 asks that the AppImage write nothing into its own mount point. That
      # has been true since 2026-08-06 but only as a one-time manual
      # observation, and the regression it guards against is silent: an
      # application keeping state beside itself works fine on the machine that
      # built it and loses the Library on the next upgrade.
      - name: Assert the bundle cannot be written to while it runs
        run: |
          ./scripts/assert-appimage-containment.sh \
            "$(ls tauri/target/release/bundle/appimage/*.AppImage | head -1)"
      - name: Run the filesystem tracer against a real Linux volume
        run: |
          mkdir -p "$RUNNER_TEMP/tracer"
          ./target/release/rom-manager-tracer \
            --target "$RUNNER_TEMP/tracer" --json | tee tracer-linux.json
      # As on the Windows job: the digest is written by the job that made the
      # bytes, so the milestone report can cite a build rather than a memory.
      - name: Record what this job built
        run: |
          scripts/record-build-identity.sh build-identity-linux.md \
            "$(ls tauri/target/release/bundle/appimage/*.AppImage | head -1)" \
            target/release/rom-manager-tracer \
            tauri/target/release/rom-manager
      - uses: actions/upload-artifact@v4
        with:
          name: linux-appimage-inputs
          path: |
            target/release/rom-manager-tracer
            tracer-linux.json
            build-identity-linux.md
            tauri/target/release/bundle/appimage/*.AppImage
            tauri/target/release/rom-manager
            packaging/linux/
