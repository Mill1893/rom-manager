# The third-party tools the packaging step fetches, pinned by content.
#
# Bundling an AppImage is not a hermetic operation. Tauri's bundler downloads
# linuxdeploy and its plugins on first use, and linuxdeploy's own AppImage
# plugin then downloads the AppImage type-2 runtime from a *third* repository.
# Six files in total, from three hosts. Four carry no upstream version at all —
# two from a `master` branch and two from a `continuous` tag — so the bytes
# behind them can change with nothing to notice it by. The other two sit behind
# release tags, which is better but not a guarantee: the `linuxdeploy` tag is
# re-rollable in place, and its asset last moved in 2024.
#
# This file records the bytes we actually built against. `fetch-bundler-tools.sh`
# fetches each entry, verifies it against the digest here, and places it where
# the tool that needs it will find it — so a build either uses these exact
# tools or fails loudly. It does not use whatever upstream happens to be
# serving today.
#
# On a digest mismatch the fetch fails rather than proceeding. That is the
# intended behaviour: an unannounced change to a binary in the release path is
# something a person should look at, not something a build should absorb. To
# adopt a new upstream version deliberately, run:
#
#     scripts/fetch-bundler-tools.sh --repin
#
# which rewrites the digests below. Review that diff like any other dependency
# bump — `git diff` on this file is the only notice you will get.
#
# Note what this does and does not buy. It removes the network from the
# packaging path only when the cache is warm or these files are already
# present; a cold run still fetches them, just with retries and verification.
# It says nothing about the application, which contains no network-capable
# crate at all — that is a separate property, asserted by the test suite.
#
# Format: <destination> <sha256> <url>
#
#   tauri   — Tauri's own bundler cache; it looks these up by exact filename.
#   runtime — ours, passed to the AppImage plugin via LDAI_RUNTIME_FILE.

