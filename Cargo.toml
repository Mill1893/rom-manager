[package]
name = "rom-manager"
version = "0.1.0"
edition = "2024"
license = "MIT"

[features]
# Off by default, deliberately. The default build contains no network-capable
# code at all, which is what the privacy evidence rests on; turning this on is a
# conscious act, not something a dependency bump can do for you.
default = []
provider-http = ["dep:ureq"]

[dependencies]
ureq = { version = "3", default-features = false, features = ["rustls"], optional = true }
fs2 = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
quick-xml = "0.37"
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
rusqlite = { version = "0.37", features = ["bundled"] }
thiserror = "2.0"
unicode-normalization = "0.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Wdk_Foundation",
  "Wdk_Storage_FileSystem",
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_System_Com",
] }

[dev-dependencies]
tempfile = "3.20"
zip = { version = "2", default-features = false, features = ["deflate"] }
rusqlite = { version = "0.37", features = ["bundled"] }

[profile.release]
lto = "thin"
strip = true
